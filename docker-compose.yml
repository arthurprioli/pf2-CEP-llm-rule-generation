services:
  postgres:
    image: postgres:15-alpine
    container_name: cep_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: cep_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  siddhi:
    image: siddhiio/siddhi-runner-alpine:latest
    container_name: cep_siddhi
    ports:
      - "9090:9090"
      - "8080:8080"

volumes:
  postgres_data:

